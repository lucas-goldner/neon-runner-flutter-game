name: neon_scramble
description: >-
  Flutter Scene (Flutter GPU + WebGL2) port of the Gemini Neon Scramble demo:
  drop into Shibuya Scramble Crossing as Pegman, weave traffic, grind Yamanote
  rails, light up neon signs, and reach Shibuya Stream - Google Tokyo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
